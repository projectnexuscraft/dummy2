<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu, Sayangku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="dust-canvas"></canvas>

  <div class="room">
    <div class="lamp-glow"></div>
    <div class="string-lights" id="string-lights"></div>
    <div class="twine" id="twine"></div>

    <header class="intro">
      <p class="eyebrow">sebuah ucapan, dari sudut kamar ini</p>
      <h1>Untuk Kamu, Sayangku</h1>
      <p class="sub">Ada satu potret yang belum sempat aku tunjukkan.</p>
    </header>

    <button class="camera-btn" id="camera-btn" aria-label="Ambil potretnya">
      <span class="camera-icon">📷</span>
      <span class="camera-label">Ambil Potretnya</span>
    </button>

    <div class="flash" id="flash"></div>

    <section class="polaroid-scene hidden" id="polaroid-scene">
      <div class="polaroid-grid" id="polaroid-grid"></div>

      <div class="letter">
        <p class="letter-message" id="letter-message"></p>
        <p class="letter-signature" id="letter-signature"></p>
      </div>
    </section>

    <div class="floor"></div>
  </div>

  <audio id="bg-music" src="musik.mp3" loop preload="none"></audio>
  <button class="vinyl-btn" id="vinyl-btn" aria-label="Putar musik latar">
    <span class="vinyl" id="vinyl"></span>
  </button>

  <script src="script.js" defer></script>
</body>
</html>
